version: '3.8'

# ==============================================================================
# 拓视未来教育「一校教培系统」阿里云生产容器编排 (Docker Compose Production)
# ==============================================================================

services:
  # 1. NestJS 后端微服务
  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: yixiao-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - ../server/.env.production
    expose:
      - "3001"
    networks:
      - yixiao-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/stats/overview || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 2. Vue 3 前端静态托管与 Nginx 反向代理
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: yixiao-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - yixiao-network

networks:
  yixiao-network:
    driver: bridge
